name: Feature request
description: Suggest an idea or a new export format.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: Describe the task or problem, not only the solution. For example "I need my customer list in my CRM with labels as tags".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could WAVault help?
  - type: markdown
    attributes:
      value: WAVault is read-only by design. Features that send messages, change chats or automate WhatsApp are out of scope.
