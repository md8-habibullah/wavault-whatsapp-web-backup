# Publishes the landing page in site/ (plus screenshots and fonts) to GitHub Pages.
# One-time setup: repository Settings → Pages → Source: GitHub Actions.
name: Website

on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/images/**', 'scripts/build-site.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queue deployments instead of cancelling one that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/build-site.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .site
      - id: deployment
        uses: actions/deploy-pages@v5
