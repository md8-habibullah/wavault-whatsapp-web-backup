# Push a tag like v1.0.1 (matching package.json "version") to build the browser zips
# and publish them as a GitHub Release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm test
      - run: npm run zip:all
      - run: npm run lint:firefox
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" .output/*.zip \
            --title "WAVault $GITHUB_REF_NAME" \
            --notes "Install: download the zip for your browser and follow the [install guide](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/install.md). Changes: [CHANGELOG](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)." \
            --generate-notes
